name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.x"

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "lts/*"

      # Omarchy refuses a plugin folder with a symlink in it, and the plugin
      # marketplace holds back any file named like an installer for review.
      - name: Plugin folder rules
        run: |
          links=$(git ls-files -s | awk '$1 == "120000" { print $4 }')
          if [ -n "$links" ]; then echo "tracked symlinks: $links"; exit 1; fi
          names=$(git ls-files | grep -iE 'install|setup' || true)
          if [ -n "$names" ]; then echo "installer-like file names: $names"; exit 1; fi

      - name: Panel behavior
        run: |
          node tests/test_mail_state.cjs
          node tests/test_panel_behavior.cjs

      - name: Contract tests
        run: python3 -m unittest discover -s tests -v

      - name: Compile Python
        run: python3 -m compileall -q lib providers tests

      - name: Manifest JSON
        run: python3 -c "import json,sys; json.load(open('manifest.json')); print('ok')"

      - name: Shell syntax
        run: bash -n bin/you-got-mail && bash -n providers/gmail

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        env:
          SHELLCHECK_OPTS: -x
        with:
          scandir: '.'
          ignore_paths: tests
          version: v0.11.0
